[project]
name = "lakehouse"
version = "0.1.0"
description = ""
authors = [
    {name = "Richard Andrés",email = "62516404+andresm-data@users.noreply.github.com"}
]
requires-python = ">3.11"
dependencies = [
    "pyarrow (>=25.0.1,<26.0.0)",
    "pyspark (>=4.2.0,<5.0.0)"
]

[project.scripts]
lh-convert = "lakehouse.ingest.convert:main"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=lakehouse --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == .__main__.:']


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
