[project]
name = "lakehouse"
version = "0.1.0"
description = ""
authors = [
    {name = "Richard Andrés",email = "62516404+andresm-data@users.noreply.github.com"}
]
requires-python = ">3.11,<4.0"
dependencies = [
    "pyarrow (==25.0.1)",
    "pyspark (==4.1.3)",
    "deltalake (==1.6.6)",
    "pyiceberg[pyarrow,pyiceberg-core,sql-sqlite] (==0.12.0)",
    "delta-spark (==4.4.1)",
    "duckdb (==2.0.0)",
    "matplotlib (==3.11.2)",
    "streamlit (==1.66.1)",
    "plotly (==7.1.0)"
]

[project.scripts]
lh-convert = "lakehouse.ingest.convert:main"
lh-merge = "lakehouse.ingest.merge:main"
lh-partition-date = "lakehouse.ingest.partition_date:main"
lh-bench-compression = "lakehouse.benchmarks.compression:main"
lh-bench-formats = "lakehouse.benchmarks.formats:main"
lh-bench-db = "lakehouse.benchmarks.results_db:main"
lh-delta-pyarrow = "lakehouse.delta.create_table_pyarrow:main"
lh-delta-merge = "lakehouse.delta.merge_table:main"
lh-delta-time-travel = "lakehouse.delta.time_travel:main"
lh-delta-schema-evolution = "lakehouse.delta.schema_evolution:main"
lh-delta-optimize = "lakehouse.delta.optimize:main"
lh-delta-vacuum = "lakehouse.delta.vacuum:main"
lh-iceberg-catalog = "lakehouse.iceberg.catalog:main"
lh-iceberg-create = "lakehouse.iceberg.create_table:main"
lh-iceberg-snapshots = "lakehouse.iceberg.snapshots:main"
lh-iceberg-ops = "lakehouse.iceberg.ops_demo:main"
lh-spark-read-write = "lakehouse.spark.read_write:main"
lh-spark-update-month = "lakehouse.spark.update_month:main"

[dependency-groups]
dev = [
    "pytest (==9.1.1)",
    "pytest-cov (==7.1.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=lakehouse --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == .__main__.:']


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
