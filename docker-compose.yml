# `docker compose up` construye la imagen y ejecuta el proyecto completo.
#   make demo                       -> todo desde cero: pipeline, pruebas, notebook y dashboard
#   docker compose run --rm tests   -> corre las pruebas dentro del contenedor
#   docker compose up dashboard     -> dashboard en http://localhost:8501, con los datos del volumen
services:
  lakehouse:
    build:
      context: .
      args:
        # Mismo UID/GID del host para que docs/ no quede con archivos de root.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: lakehouse-lab:latest
    command: ["bash", "scripts/pipeline.sh"]
    environment:
      LAKEHOUSE_DATA_DIR: /app/data
      LAKEHOUSE_DOCS_DIR: /app/docs
    volumes:
      # Datos en un volumen propio: el catálogo Iceberg guarda rutas absolutas,
      # así que no se comparte con el data/ del host.
      - lakehouse-data:/app/data
      # Informes en el docs/ del repositorio (:z para SELinux).
      - ./docs:/app/docs:z
      # El notebook final, para ejecutarlo con los datos del volumen (make demo).
      - ./notebooks:/app/notebooks:z
      # Jars de Spark (Delta, Iceberg, SQLite JDBC) descargados de Maven una sola vez.
      - ivy-cache:/home/lakehouse/.ivy2.5.2

  dashboard:
    image: lakehouse-lab:latest
    profiles: ["dashboard"]
    command: ["streamlit", "run", "src/lakehouse/dashboard/app.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      LAKEHOUSE_DATA_DIR: /app/data
      LAKEHOUSE_DOCS_DIR: /app/docs
    ports:
      - "8501:8501"
    volumes:
      # Los mismos datos que dejó el pipeline: base de resultados, Delta e Iceberg.
      - lakehouse-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  tests:
    image: lakehouse-lab:latest
    profiles: ["tests"]
    command: ["pytest", "-p", "no:cacheprovider"]
    volumes:
      - ivy-cache:/home/lakehouse/.ivy2.5.2

volumes:
  lakehouse-data:
  ivy-cache:
